<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Voice Agent — Call Quality Dashboard</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0b0d12; color: #e6e6e6; padding: 2rem; }
  h1 { font-size: 1.1rem; color: #9fb3ff; }
  .cards { display: flex; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; }
  .card { background: #151924; border-radius: 8px; padding: 1rem 1.5rem; min-width: 120px; }
  .card .val { font-size: 1.6rem; font-weight: 600; }
  .card .label { font-size: 0.75rem; color: #8a93a6; text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #262b38; font-size: 0.85rem; }
  th { color: #8a93a6; font-weight: 500; }
  #empty { color: #8a93a6; font-style: italic; }
</style>
</head>
<body>
  <h1>Voice Agent — Call Quality Dashboard</h1>
  <div class="cards" id="cards"></div>
  <h2 style="font-size:0.95rem;color:#8a93a6;">Flagged calls</h2>
  <table id="flaggedTable">
    <thead><tr><th>Call ID</th><th>Total (ms)</th><th>LLM TTFT (ms)</th><th>STT (ms)</th><th>Transcript</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="empty" style="display:none;">No flagged calls yet.</div>

<script>
async function refresh() {
  const metrics = await (await fetch('/metrics')).json();
  const cards = document.getElementById('cards');
  cards.innerHTML = `
    <div class="card"><div class="val">${metrics.count}</div><div class="label">Calls logged</div></div>
    <div class="card"><div class="val">${metrics.p50_ms ?? '—'}</div><div class="label">p50 total ms</div></div>
    <div class="card"><div class="val">${metrics.p95_ms ?? '—'}</div><div class="label">p95 total ms</div></div>
    <div class="card"><div class="val">${metrics.p99_ms ?? '—'}</div><div class="label">p99 total ms</div></div>
    <div class="card"><div class="val">${(metrics.flagged_rate * 100).toFixed(1)}%</div><div class="label">Flagged rate</div></div>
  `;

  const flagged = await (await fetch('/calls/flagged')).json();
  const tbody = document.querySelector('#flaggedTable tbody');
  tbody.innerHTML = '';
  document.getElementById('empty').style.display = flagged.length ? 'none' : 'block';
  for (const c of flagged) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${c.call_id.slice(0, 8)}</td><td>${c.total_ms}</td><td>${c.llm_ttft_ms}</td><td>${c.stt_ms}</td><td>${(c.transcript||'').slice(0,60)}</td>`;
    tbody.appendChild(tr);
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
